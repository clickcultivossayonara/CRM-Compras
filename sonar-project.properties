# Análisis estático con SonarCloud (o SonarQube).
# Los valores sensibles o propios de la cuenta NO van aquí: se leen de variables de entorno.
#   SONAR_TOKEN         token de análisis (obligatorio)
#   SONAR_ORGANIZATION  clave de la organización en SonarCloud
#   SONAR_PROJECT_KEY   clave del proyecto en SonarCloud
#   SONAR_HOST_URL      solo para SonarQube propio; para SonarCloud se omite

sonar.projectName=CRM-Compras
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/migraciones/**
sonar.cpd.exclusions=tests/**

sonar.python.version=3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=reports/pytest.xml

# El análisis espera el resultado del Quality Gate y falla si no pasa.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
