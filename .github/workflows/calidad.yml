name: Calidad

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    services:
      # Base solo para pruebas de integración; credenciales de prueba, no de producción.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pruebas
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: crm_pruebas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pruebas" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pruebas:pruebas@localhost:5432/crm_pruebas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud necesita el historial para identificar el código nuevo

      - uses: astral-sh/setup-uv@v6

      - name: Instalar dependencias
        run: uv sync --locked --group propiedad # Hypothesis solo para que mypy revise las pruebas de propiedad

      - name: Linter y formato
        run: uv run ruff check . && uv run ruff format --check .

      - name: Tipos
        run: uv run mypy

      - name: Auditoría de dependencias
        run: |
          mkdir -p reports
          uv export --frozen --no-emit-project --group propiedad -q -o reports/requisitos-auditoria.txt
          uv tool run pip-audit -r reports/requisitos-auditoria.txt --disable-pip --require-hashes --strict

      - name: Humo
        run: uv run pytest tests/humo

      - name: Suite completa con cobertura
        run: |
          mkdir -p reports
          uv run pytest --cov --cov-report=xml --junitxml=reports/pytest.xml

      - name: SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: uv tool run pysonar
