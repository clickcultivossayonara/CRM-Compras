[project]
name = "crm-compras"
version = "0.1.0"
description = "Pedidos y presupuesto del área de compras"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.16.0",
    "psycopg[binary]>=3.2",
]
# Pruebas de propiedad: opcionales, se instalan con `uv sync --group propiedad`.
propiedad = [
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crm_compras"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not propiedad and not softland'"
markers = [
    "unitaria: lógica del dominio, sin I/O",
    "caja_negra: comportamiento por entradas y salidas de la API",
    "humo: arranque y flujos críticos, rápido",
    "integracion: con base de datos real",
    "propiedad: pruebas de propiedad (opcionales)",
    "softland: consultas reales contra Softland de solo lectura (X1, manual)",
    "concurrencia: envíos simultáneos contra la misma partida (I2)",
    "contrato: contrato entre sincronizador y API (C1)",
    "regresion_cargador: cargador comparado con la plantilla (C2)",
    "autorizacion: matriz de permisos por rol (S1)",
    "rendimiento: tiempos de respuesta (R1)",
]

[tool.coverage.run]
source = ["crm_compras"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
strict = true
files = ["src", "tests"]
